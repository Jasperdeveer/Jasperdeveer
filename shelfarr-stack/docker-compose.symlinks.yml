# Override: geef Shelfarr dezelfde kijk op de rclone-mount als Bookshelf heeft.
#
# Decypharr zet in zijn downloadmap symlinks neer die naar de Torbox-mount
# wijzen. Bookshelf lost die op omdat het `/mnt/torbox` op `/torbox` gemount
# heeft. Ziet Shelfarr dat pad niet, of op een ander containerpad, dan wijzen
# diezelfde symlinks binnen Shelfarr nergens heen en mislukt elke import.
#
# `scripts/make-env.sh` leest beide waarden uit de draaiende Bookshelf-container
# en schakelt deze override in zodra die mount daar bestaat.

services:
  shelfarr:
    volumes:
      - ${TORBOX_HOST_PATH:-/mnt/torbox}:${TORBOX_CONTAINER_PATH:-/torbox}:ro,rslave
