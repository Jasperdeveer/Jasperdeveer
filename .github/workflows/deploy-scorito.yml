name: Deploy Scorito Webapp to Render

on:
  push:
    branches: [claude/scorito-auto-fill-webapp-9rj7jr, main]
    paths: [scorito-webapp/**, render.yaml]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
