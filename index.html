<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jasper de Veer — Contact</title>
  <meta name="description" content="Contact Jasper de Veer — creatief professional, ontwerper en mediamaker." />

  <style>
    @font-face {
      font-family: 'JSPR';
      src: url('assets/fonts/JSPR-ISOMETRIC.otf') format('opentype');
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #000;
      --surface: #0d0d0d;
      --border:  #1a1a1a;
      --teal:    #009999;
      --white:   #fff;
      --gray:    #555;
      --gray-lt: #888;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* subtle grid */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,153,153,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,153,153,0.035) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 1.6rem 2.4rem;
      gap: 0;
      overflow: hidden;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .logo { height: 28px; display: block; }
    .logo img { height: 100%; width: auto; display: block; }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-lt);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ── Middle: name + photo ────────────────────────────────────────────── */
    .middle {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 2rem;
      padding: 1rem 0;
    }

    .name-block {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
    }

    .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .eyebrow::before {
      content: '';
      width: 24px; height: 1px;
      background: var(--teal);
      display: block;
    }

    .name {
      font-family: 'JSPR', 'Courier New', monospace;
      font-size: clamp(3.8rem, 9.5vw, 8.5rem);
      line-height: 0.88;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: var(--white);
    }
    .name em {
      font-style: normal;
      color: var(--teal);
      display: block;
    }

    .tagline {
      margin-top: 1.2rem;
      font-size: 0.78rem;
      color: var(--gray-lt);
      letter-spacing: 0.05em;
      line-height: 1.7;
      max-width: 320px;
    }

    /* ── Photo ───────────────────────────────────────────────────────────── */
    .photo-col {
      display: flex;
      align-items: flex-end;
      height: 100%;
    }

    .photo-wrap {
      position: relative;
      width: clamp(140px, 18vw, 240px);
    }

    /* teal border frame offset */
    .photo-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid var(--border);
      z-index: 2;
      pointer-events: none;
    }

    /* corner marks */
    .photo-wrap::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px;
      width: 18px; height: 18px;
      border-top: 2px solid var(--teal);
      border-left: 2px solid var(--teal);
      z-index: 3;
    }
    .corner {
      position: absolute;
      bottom: -5px; right: -5px;
      width: 18px; height: 18px;
      border-bottom: 2px solid var(--teal);
      border-right: 2px solid var(--teal);
      z-index: 3;
    }

    .photo-wrap img {
      display: block;
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      object-position: center top;
      filter: grayscale(100%) contrast(1.08);
      transition: filter 0.6s ease;
    }
    .photo-wrap:hover img { filter: grayscale(50%) contrast(1.05); }

    /* teal glow at bottom of photo */
    .photo-wrap .glow {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to top, rgba(0,153,153,0.12), transparent);
      pointer-events: none;
      z-index: 1;
    }

    /* scan line number */
    .photo-id {
      position: absolute;
      bottom: 0.6rem; left: 0.7rem;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: rgba(0,153,153,0.6);
      font-family: 'Courier New', monospace;
      z-index: 4;
    }

    /* ── Bottom bar ──────────────────────────────────────────────────────── */
    .bottom {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 2rem;
    }

    /* contact links */
    .links {
      display: flex;
      gap: 0;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--gray-lt);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      padding: 0.55rem 1.1rem;
      border: 1px solid transparent;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
      position: relative;
    }
    .link:not(:last-child) { border-right-color: var(--border); }
    .link:first-child { border-left-color: var(--border); }
    .link:last-child  { border-right-color: var(--border); }

    .link svg {
      width: 13px; height: 13px;
      stroke: currentColor;
      flex-shrink: 0;
      transition: stroke 0.25s;
    }

    .link:hover {
      color: var(--teal);
      border-color: var(--teal) !important;
      background: rgba(0,153,153,0.06);
      z-index: 1;
    }

    /* biz details */
    .biz {
      display: flex;
      gap: 1.6rem;
      flex-shrink: 0;
    }
    .biz-item {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      text-align: right;
    }
    .biz-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .biz-value {
      font-size: 0.7rem;
      font-family: 'Courier New', monospace;
      color: var(--gray-lt);
      letter-spacing: 0.04em;
    }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; gap: 1.5rem; padding: 1.2rem 1.4rem; }
      .middle { grid-template-columns: 1fr; gap: 1.5rem; }
      .photo-col { justify-content: center; order: -1; }
      .photo-wrap { width: clamp(140px, 55vw, 220px); }
      .name { font-size: clamp(3rem, 14vw, 5rem); }
      .bottom { grid-template-columns: 1fr; gap: 1rem; }
      .links { flex-wrap: wrap; }
      .biz { flex-direction: row; flex-wrap: wrap; text-align: left; }
      .biz-item { text-align: left; }
    }
  </style>
</head>
<body>
